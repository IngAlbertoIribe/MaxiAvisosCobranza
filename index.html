<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maxikash - Generador Masivo de Cobranza desde Excel</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel para compilar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- SheetJS para leer archivos Excel (.xlsx, .xls, .csv) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- html2canvas para renderizar la imagen en alta definición -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
    * { 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      text-rendering: geometricPrecision;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .no-compress {
        letter-spacing: 0px !important;
        word-spacing: normal !important;
    }
  </style>
</head>
<body class="bg-[#E8EEF7] min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [filasExcel, setFilasExcel] = useState([]);
      const [columnasExcel, setColumnasExcel] = useState([]);
      const [registros, setRegistros] = useState([]);
      const [indiceActual, setIndiceActual] = useState(0);

      const [colNombre, setColNombre] = useState("");
      const [colMonto, setColMonto] = useState("");
      const [colCelular, setColCelular] = useState("");
      const [colClabe, setColClabe] = useState("");

      const [clienteNombre, setClienteNombre] = useState("");
      const [monto, setMonto] = useState("");
      const [celular, setCelular] = useState("");
      const [clabe, setClabe] = useState("");

      // GESTORES DINÁMICOS
      const [listaGestores, setListaGestores] = useState([]);
      const [gestorSeleccionado, setGestorSeleccionado] = useState("manual");
      const [nombreGestor, setNombreGestor] = useState("");
      const [telGestor, setTelGestor] = useState("");

      const [generando, setGenerando] = useState(false);
      const [escala, setEscala] = useState(1);
      const [criterioOrden, setCriterioOrden] = useState("monto_desc");
      const [alturaFicha, setAlturaFicha] = useState(1200);

      const previewContenedorRef = useRef(null);
      const fichaRef = useRef(null); 

      // 1. Cargar el JSON de gestores al iniciar
      useEffect(() => {
        fetch('gestores.json')
          .then(res => {
            if (!res.ok) throw new Error("No existe gestores.json");
            return res.json();
          })
          .then(data => {
            setListaGestores(data);
            if (data.length > 0) {
              setGestorSeleccionado(data[0].id);
              setNombreGestor(data[0].nombre);
              setTelGestor(data[0].telefono);
            } else {
              setGestorSeleccionado("manual");
            }
          })
          .catch(err => {
            console.log("Archivo gestores.json no encontrado, se habilitará modo manual por defecto.", err);
            setGestorSeleccionado("manual");
          });
      }, []);

      useEffect(() => {
        const ajustarEscala = () => {
          if (previewContenedorRef.current) {
            const ancho = previewContenedorRef.current.clientWidth;
            setEscala(Math.min(1, ancho / 1080));
          }
        };
        ajustarEscala();
        window.addEventListener("resize", ajustarEscala);
        return () => window.removeEventListener("resize", ajustarEscala);
      }, []);

      useEffect(() => {
        if (!fichaRef.current) return;
        const observer = new ResizeObserver((entries) => {
          for (let entry of entries) {
            setAlturaFicha(entry.contentRect.height);
          }
        });
        observer.observe(fichaRef.current);
        return () => observer.disconnect();
      }, [clienteNombre, monto, clabe, nombreGestor, telGestor]);

      const formatearMoneda = (val) => {
        const num = parseFloat(String(val).replace(/[^0-9.]/g, "")) || 0;
        return num.toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      const calcularDiasVencidos = () => {
        const hoy = new Date();
        const diaSemana = hoy.getDay(); 
        const dias = (diaSemana + 6) % 7;
        return dias === 0 ? "VENCE HOY" : `${dias} DÍAS VENCIDOS`;
      };
      const textoVencimiento = calcularDiasVencidos();

      const autoDetectarColumnas = (cols) => {
        const buscarColumna = (palabras) => cols.find(c => palabras.some(p => c.toLowerCase().includes(p))) || "";
        const nCol = buscarColumna(["nombre", "cliente", "titular", "deudor"]) || cols[0] || "";
        const mCol = buscarColumna(["monto", "minimo", "saldo", "pago", "adeudo", "total"]) || (cols[1] || "");
        const cCol = buscarColumna(["celular", "tel", "telefono", "movil", "whatsapp"]) || (cols[2] || "");
        const clCol = buscarColumna(["clabe", "cuenta", "stp", "transferencia"]) || (cols[3] || "");

        setColNombre(nCol);
        setColMonto(mCol);
        setColCelular(cCol);
        setColClabe(clCol);

        return { nCol, mCol, cCol, clCol };
      };

      const handleArchivoExcel = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: "array" });
          const hojaNombre = workbook.SheetNames[0];
          const hoja = workbook.Sheets[hojaNombre];
          const json = XLSX.utils.sheet_to_json(hoja, { defval: "" });

          if (json.length > 0) {
            const cols = Object.keys(json[0]);
            setColumnasExcel(cols);
            setFilasExcel(json);
            const detectadas = autoDetectarColumnas(cols);
            procesarRegistros(json, detectadas.nCol, detectadas.mCol, detectadas.cCol, detectadas.clCol, criterioOrden);
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const procesarRegistros = (filas, nCol, mCol, cCol, clCol, orden) => {
        if (!filas || filas.length === 0) return;
        let lista = filas.map((fila, index) => ({
          id: index,
          nombre: nCol ? String(fila[nCol] || "").trim().toUpperCase() : `CLIENTE #${index + 1}`,
          monto: mCol ? (parseFloat(String(fila[mCol]).replace(/[^0-9.]/g, "")) || 0) : 0,
          celular: cCol ? String(fila[cCol] || "").replace(/\D/g, "") : "",
          clabe: clCol ? String(fila[clCol] || "").replace(/\D/g, "") : ""
        }));

        if (orden === "nombre_asc") lista.sort((a, b) => a.nombre.localeCompare(b.nombre));
        else if (orden === "nombre_desc") lista.sort((a, b) => b.nombre.localeCompare(a.nombre));
        else if (orden === "monto_asc") lista.sort((a, b) => a.monto - b.monto);
        else if (orden === "monto_desc") lista.sort((a, b) => b.monto - a.monto);

        setRegistros(lista);
        if (lista.length > 0) {
          seleccionarCliente(lista[0]);
          setIndiceActual(0);
        }
      };

      const seleccionarCliente = (c) => {
        setClienteNombre(c.nombre || "");
        setMonto(String(c.monto || ""));
        setCelular(c.celular || "");
        setClabe(c.clabe || "");
      };

      const cambiarOrden = (nuevoOrden) => {
        setCriterioOrden(nuevoOrden);
        procesarRegistros(filasExcel, colNombre, colMonto, colCelular, colClabe, nuevoOrden);
      };

      // Manejador del select de gestores con la lógica del JSON
      const handleGestorChange = (e) => {
        const idGestor = e.target.value;
        setGestorSeleccionado(idGestor);
        
        if (idGestor === "manual") {
          setNombreGestor("");
          setTelGestor("");
        } else {
          const gestor = listaGestores.find(g => String(g.id) === String(idGestor));
          if (gestor) {
            setNombreGestor(gestor.nombre);
            setTelGestor(gestor.telefono);
          }
        }
      };

      const generarImagen = async () => {
        if (!fichaRef.current) return;
        setGenerando(true);
        
        try {
          await document.fonts.ready;
          
          const elemento = fichaRef.current;
          
          const originalTransform = elemento.style.transform;
          const originalTransformOrigin = elemento.style.transformOrigin;
          
          elemento.style.transform = 'none';
          elemento.style.transformOrigin = 'unset';
          
          await new Promise(r => setTimeout(r, 50));
          
          const canvas = await html2canvas(elemento, {
            scale: 2, 
            backgroundColor: "#ffffff",
            useCORS: true,
            allowTaint: true,
            logging: false
          });
          
          elemento.style.transform = originalTransform;
          elemento.style.transformOrigin = originalTransformOrigin;

          const imgData = canvas.toDataURL("image/jpeg", 0.95);
          const link = document.createElement("a");
          link.download = `MAXIKASH_${(clienteNombre || "CLIENTE").split(" ")[0]}_$${monto || "0"}.jpg`;
          link.href = imgData;
          link.click();
        } catch (error) {
          console.error("Error al generar imagen:", error);
          alert("Hubo un error al generar la imagen. Intenta de nuevo.");
        } finally {
          setGenerando(false);
        }
      };

      const enviarWhatsApp = () => {
        if (!celular) {
          alert("El cliente actual no tiene un número celular válido asignado.");
          return;
        }
        
        const texto = encodeURIComponent(
          `Hola ${clienteNombre || "Cliente"},
` +
          `Le compartimos su aviso de pago urgente de Maxikash por $${formatearMoneda(monto)} MXN.
` +
          `Puede realizar su transferencia SPEI a su cuenta STP: ${clabe || "Sin Clabe asignada"}. Quedamos a sus órdenes.`
        );
        window.open(`https://wa.me/52${celular}?text=${texto}`, "_blank");
      };

      const fechaHoy = new Date().toLocaleDateString("es-MX", {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });

      return (
        <div className="w-full max-w-[1280px] mx-auto p-4 md:p-6">
          <header className="bg-[#0A1931] rounded-2xl p-6 text-white mb-6 flex flex-col md:flex-row items-center justify-between shadow-xl gap-4">
            <div className="flex items-center gap-4">
              <div className="w-12 h-12 bg-[#FFCC00] text-[#0A1931] font-black text-2xl rounded-full flex items-center justify-center">M</div>
              <div>
                <h1 className="text-xl font-black tracking-tight">MAXIKASH COBRANZA • MÓDULO EXCEL</h1>
                <p className="text-slate-400 text-xs mt-0.5">Lector de gestores.json y espaciado ajustado</p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <label className="bg-[#FFCC00] hover:bg-yellow-400 text-[#0A1931] px-5 py-2.5 rounded-xl font-bold cursor-pointer text-sm transition-all shadow-md">
                📁 Cargar Excel (.xlsx / .csv)
                <input type="file" accept=".xlsx, .xls, .csv" onChange={handleArchivoExcel} className="hidden" />
              </label>
            </div>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 space-y-4">

              {/* GESTORES (JSON + MANUAL) */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h2 className="text-sm font-black text-[#0A1931] uppercase tracking-wider flex items-center gap-2">
                  <span>👔</span> Datos del Gestor en Turno
                </h2>
                
                <div>
                  <label className="font-bold text-slate-700 block mb-1 text-xs">Seleccionar Gestor:</label>
                  <select 
                    value={gestorSeleccionado}
                    onChange={handleGestorChange}
                    className="w-full bg-blue-50 border-2 border-blue-300 p-2.5 rounded-xl font-bold text-[#0A1931] focus:ring-2 focus:ring-blue-400 outline-none mb-3"
                  >
                    {listaGestores.length > 0 && listaGestores.map(gestor => (
                      <option key={gestor.id} value={gestor.id}>
                        {gestor.nombre}
                      </option>
                    ))}
                    <option value="manual">➕ Ingresar otro gestor (Manual)</option>
                  </select>
                </div>

                <div className={`grid grid-cols-2 gap-3 text-xs ${gestorSeleccionado !== "manual" ? "opacity-70 pointer-events-none" : ""}`}>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Nombre que aparecerá</label>
                    <input 
                      type="text"
                      readOnly={gestorSeleccionado !== "manual"}
                      placeholder="Ej. Lic Fernando Arenas"
                      value={nombreGestor}
                      onChange={(e) => setNombreGestor(e.target.value)}
                      className={`w-full p-2.5 rounded-lg font-bold text-[#0A1931] outline-none ${gestorSeleccionado !== 'manual' ? 'bg-slate-100 border border-slate-200' : 'bg-amber-50 border-2 border-[#FFCC00] focus:ring-2 focus:ring-[#FFCC00]'}`}
                    />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Teléfono que aparecerá</label>
                    <input 
                      type="text"
                      readOnly={gestorSeleccionado !== "manual"}
                      placeholder="Ej. 6861183207"
                      value={telGestor}
                      onChange={(e) => setTelGestor(e.target.value)}
                      className={`w-full p-2.5 rounded-lg font-bold text-[#0A1931] outline-none ${gestorSeleccionado !== 'manual' ? 'bg-slate-100 border border-slate-200' : 'bg-amber-50 border-2 border-[#FFCC00] focus:ring-2 focus:ring-[#FFCC00]'}`}
                    />
                  </div>
                </div>
              </div>

              {/* Asignación y Selección de Columnas */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-sm font-black text-[#0A1931] uppercase tracking-wider">
                    Asignación de Columnas (Excel)
                  </h2>
                </div>
                
                {columnasExcel.length > 0 ? (
                  <div className="grid grid-cols-2 gap-3 text-xs">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">👤 Nombre Cliente</label>
                      <select value={colNombre} onChange={(e) => { setColNombre(e.target.value); procesarRegistros(filasExcel, e.target.value, colMonto, colCelular, colClabe, criterioOrden); }} className="w-full bg-amber-50/60 border-2 border-[#FFCC00] p-2 rounded-lg font-bold text-[#0A1931] focus:ring-2 focus:ring-[#FFCC00] outline-none">
                        <option value="">-- Seleccionar --</option>
                        {columnasExcel.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">💰 Monto a Pagar</label>
                      <select value={colMonto} onChange={(e) => { setColMonto(e.target.value); procesarRegistros(filasExcel, colNombre, e.target.value, colCelular, colClabe, criterioOrden); }} className="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg font-semibold">
                        <option value="">-- Seleccionar --</option>
                        {columnasExcel.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">📱 Cel. Cliente (WhatsApp)</label>
                      <select value={colCelular} onChange={(e) => { setColCelular(e.target.value); procesarRegistros(filasExcel, colNombre, colMonto, e.target.value, colClabe, criterioOrden); }} className="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg font-semibold">
                        <option value="">-- Seleccionar --</option>
                        {columnasExcel.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">🏦 CLABE / STP</label>
                      <select value={colClabe} onChange={(e) => { setColClabe(e.target.value); procesarRegistros(filasExcel, colNombre, colMonto, colCelular, e.target.value, criterioOrden); }} className="w-full bg-slate-50 border border-slate-200 p-2 rounded-lg font-semibold">
                        <option value="">-- Seleccionar --</option>
                        {columnasExcel.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                  </div>
                ) : (
                  <p className="text-xs text-slate-500 bg-slate-50 p-3 rounded-lg border border-dashed border-slate-300">
                    Carga un archivo de Excel para mapear los datos del cliente.
                  </p>
                )}

                {/* Filtro de Orden */}
                <div>
                  <label className="font-bold text-xs text-slate-600 block mb-1">Ordenar Lista por:</label>
                  <select value={criterioOrden} onChange={(e) => cambiarOrden(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl font-bold text-sm text-[#0A1931]">
                    <option value="monto_desc">Monto: Mayor a Menor ($$$ &rarr; $)</option>
                    <option value="monto_asc">Monto: Menor a Mayor ($ &rarr; $$$)</option>
                    <option value="nombre_asc">Nombre: Alfabético (A - Z)</option>
                    <option value="nombre_desc">Nombre: Alfabético (Z - A)</option>
                  </select>
                </div>
              </div>

              {/* Lista Dinámica de Clientes */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-xs font-black uppercase tracking-wider text-[#0A1931]">
                    Lista de Clientes ({registros.length})
                  </h3>
                </div>

                <div className="max-h-[300px] overflow-y-auto space-y-2 pr-1">
                  {registros.length > 0 ? (
                    registros.map((item, idx) => (
                      <div
                        key={item.id}
                        onClick={() => {
                          setIndiceActual(idx);
                          seleccionarCliente(item);
                        }}
                        className={`p-3 rounded-xl border text-xs cursor-pointer transition-all flex justify-between items-center ${
                          indiceActual === idx
                            ? "bg-[#0A1931] text-white border-[#0A1931] shadow-md ring-2 ring-[#FFCC00]"
                            : "bg-slate-50 text-slate-800 border-slate-200 hover:bg-slate-100"
                        }`}
                      >
                        <div className="truncate max-w-[210px]">
                          <p className="font-bold text-sm truncate">
                            {item.nombre || "(Sin nombre registrado)"}
                          </p>
                          <p className={`text-[11px] mt-0.5 font-medium ${indiceActual === idx ? "text-slate-300" : "text-slate-500"}`}>
                            Celular: {item.celular || "S/N"}
                          </p>
                        </div>
                        <div className="text-right font-black">
                          <p className={`text-sm ${indiceActual === idx ? "text-[#FFCC00]" : "text-[#0A1931]"}`}>
                            ${formatearMoneda(item.monto)}
                          </p>
                        </div>
                      </div>
                    ))
                  ) : (
                    <div className="text-center py-8 text-slate-400 text-xs">
                      No hay clientes cargados.
                    </div>
                  )}
                </div>
              </div>

              {/* Acciones */}
              <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <button
                  onClick={generarImagen}
                  disabled={generando}
                  className="w-full bg-[#FFCC00] hover:bg-yellow-400 text-[#0A1931] font-black py-3.5 px-4 rounded-xl text-sm shadow-[0_4px_0_#0A1931] active:translate-y-0.5 transition-all flex items-center justify-center gap-2"
                >
                  <span>📷</span>
                  {generando ? "GENERANDO HD..." : "Descargar Imagen HD para WhatsApp"}
                </button>

                <button
                  onClick={enviarWhatsApp}
                  className="w-full bg-[#22C55E] hover:bg-green-600 text-white font-bold py-3 px-4 rounded-xl text-sm shadow-md active:translate-y-0.5 transition-all flex items-center justify-center gap-2"
                >
                  <span>💬</span> Abrir Chat con Cliente en WhatsApp
                </button>
              </div>
            </div>

            {/* Vista Previa del Aviso */}
            <div className="lg:col-span-7">
              <div className="flex justify-between items-center mb-2 px-1">
                <span className="text-xs font-black text-slate-500 uppercase">Vista Previa HD</span>
                <span className="text-xs text-slate-400">Escala visual: {Math.round(escala * 100)}%</span>
              </div>

              {/* Contenedor responsivo */}
              <div ref={previewContenedorRef} className="w-full bg-slate-300 rounded-2xl p-4 shadow-inner overflow-hidden flex justify-center">
                <div style={{
                  width: "1080px",
                  height: `${alturaFicha * escala}px`,
                  position: "relative"
                }}>
                  {/* === ESTA ES LA TARJETA VISIBLE Y LA QUE SE CAPTURA === */}
                  <div 
                    ref={fichaRef}
                    id="ficha-visible"
                    className="shadow-2xl overflow-hidden font-sans rounded-2xl flex flex-col"
                    style={{ 
                      width: "1080px", 
                      backgroundColor: "#ffffff",
                      transform: `scale(${escala})`, 
                      transformOrigin: "top left",
                      position: "absolute",
                      top: 0,
                      left: 0
                    }}
                  >
                    <div className="bg-[#0A1931] px-10 pt-10 pb-8">
                      <div className="flex justify-between items-start">
                        <div>
                          <div className="text-white font-black leading-none no-compress" style={{ fontSize: "52px" }}>MAXIKASH</div>
                          <div className="text-slate-400 font-bold mt-2 no-compress" style={{ fontSize: "18px" }}>
                            CRÉDITO PARA TU MOTO
                          </div>
                        </div>
                        <div className="bg-[#FFCC00] text-[#0A1931] font-black px-6 py-3 rounded-full no-compress" style={{ fontSize: "20px" }}>
                          AVISO DE COBRANZA
                        </div>
                      </div>
                      <div className="mt-10">
                        <div className="text-white font-black leading-tight no-compress" style={{ fontSize: "72px" }}>
                          PONTE AL<br />CORRIENTE
                        </div>
                        <div className="text-[#FFCC00] font-black mt-2 no-compress" style={{ fontSize: "36px" }}>
                          PAGA EL MÍNIMO
                        </div>
                      </div>
                    </div>

                    <div className="bg-white px-10 py-10 flex-grow">
                      <div className="text-slate-500 font-bold uppercase no-compress" style={{ fontSize: "18px" }}>
                        {fechaHoy} • Mexicali, B.C.
                      </div>

                      <div className="mt-8">
                        <div className="font-black text-[#0A1931] no-compress" style={{ fontSize: "22px" }}>ESTIMADO(A):</div>
                        <div className="mt-3 bg-[#EEF2FF] border-2 border-[#DBEAFE] rounded-xl px-6 py-5">

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador Masivo de Cobranza</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS, html2canvas, JSZip directamente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
    * { 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      text-rendering: geometricPrecision;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .no-compress { letter-spacing: 0px !important; word-spacing: normal !important; }
  </style>
</head>
<body class="bg-[#E8EEF7] min-h-screen text-slate-800">

  <div class="w-full max-w-[1360px] mx-auto p-4 md:p-6">
    <!-- Header Principal -->
    <header class="bg-[#4348EB] rounded-2xl p-6 text-white mb-6 flex flex-col md:flex-row items-center justify-between shadow-xl gap-4">
      <div class="flex items-center gap-4">
        <!-- Logo Header web -->
        <img src="logo.png" alt="Maxikash Logo" class="h-12 w-auto object-contain block" onerror="this.onerror=null; this.src='https://maxikash.mx/wp-content/uploads/2023/11/logo-maxikash-white.png';" />
        <div>
          <h1 class="text-xl font-black tracking-tight">COBRANZA • EMISIÓN MASIVA</h1>
          <p class="text-slate-300 text-xs mt-0.5">1. Excel Gestores &rarr; 2. Excel Cuentas &rarr; 3. Exportación Masiva</p>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-1 bg-white/10 p-1.5 rounded-xl border border-white/20 shadow-inner">
        <button class="btn-dia px-3 py-2 rounded-lg text-xs font-black transition-all text-white hover:bg-white/20" data-dia="1">LUN</button>
        <button class="btn-dia px-3 py-2 rounded-lg text-xs font-black transition-all text-white hover:bg-white/20" data-dia="2">MAR</button>
        <button class="btn-dia px-3 py-2 rounded-lg text-xs font-black transition-all text-white hover:bg-white/20" data-dia="3">MIÉ</button>
        <button class="btn-dia px-3 py-2 rounded-lg text-xs font-black transition-all text-white hover:bg-white/20" data-dia="4">JUE</button>
        <button class="btn-dia px-3 py-2 rounded-lg text-xs font-black transition-all text-white hover:bg-white/20" data-dia="5">VIE</button>
        <button class="btn-dia px-3 py-2 rounded-lg text-xs font-black transition-all text-white hover:bg-white/20" data-dia="6">SÁB</button>
        <button class="btn-dia px-3 py-2 rounded-lg text-xs font-black transition-all text-white hover:bg-white/20" data-dia="0">DOM</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Columna Izquierda: Controles -->
      <div class="lg:col-span-5 space-y-4">
        
        <!-- PASO 1: CARGAR BASE DE GESTORES DESDE EXCEL -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-black text-[#0A1931] uppercase tracking-wider flex items-center gap-2">
              <span class="w-5 h-5 rounded-full bg-[#4348EB] text-white flex items-center justify-center text-[10px]">1</span>
              Base de Gestores (Excel)
            </h2>
            <span id="badgeGestoresCargados" class="bg-slate-100 text-slate-600 text-[11px] font-bold px-2.5 py-1 rounded-lg border border-slate-200">
              0 gestores
            </span>
          </div>

          <label class="w-full bg-slate-100 hover:bg-slate-200 text-[#0A1931] border-2 border-dashed border-slate-300 hover:border-[#4348EB] py-3 px-4 rounded-xl font-bold cursor-pointer text-xs transition-all text-center block">
            📂 Cargar Excel de Gestores (.xlsx / .csv)
            <input type="file" id="fileGestoresInput" accept=".xlsx, .xls, .csv" class="hidden" />
          </label>

          <div id="contenedorMapeoGestores" class="hidden space-y-2 pt-2 border-t border-slate-100">
            <p class="text-[11px] font-black text-slate-600 uppercase">Columnas del Excel de Gestores:</p>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div>
                <label class="font-bold text-slate-600 block mb-0.5 text-[10px]">👤 Nombre Gestor</label>
                <select id="colGestorNombreSel" class="w-full bg-blue-50/70 border border-blue-200 p-1.5 rounded-lg font-bold text-[#0A1931] text-xs outline-none"></select>
              </div>
              <div>
                <label class="font-bold text-slate-600 block mb-0.5 text-[10px]">📱 Teléfono / Celular</label>
                <select id="colGestorTelSel" class="w-full bg-slate-50 border border-slate-200 p-1.5 rounded-lg font-semibold text-xs outline-none"></select>
              </div>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-100">
            <label class="font-bold text-slate-600 block mb-1 text-[11px]">Gestor en Turno / Por Defecto:</label>
            <select id="selectGestorDefault" class="w-full bg-slate-50 border border-slate-200 p-2 rounded-xl font-bold text-xs text-[#0A1931] outline-none">
              <option value="">Carga el Excel de Gestores primero</option>
            </select>
          </div>
        </div>

        <!-- PASO 2: CARGAR BASE DE CUENTAS DESDE EXCEL -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-black text-[#0A1931] uppercase tracking-wider flex items-center gap-2">
              <span class="w-5 h-5 rounded-full bg-[#4348EB] text-white flex items-center justify-center text-[10px]">2</span>
              Base de Cuentas (Excel)
            </h2>
            <span id="badgeCuentasCargadas" class="bg-amber-50 text-amber-800 text-[11px] font-bold px-2.5 py-1 rounded-lg border border-amber-200">
              0 cuentas
            </span>
          </div>

          <label class="w-full bg-[#C6D82E] hover:bg-[#B5C62A] text-[#0A1931] py-3 px-4 rounded-xl font-black cursor-pointer text-xs transition-all shadow-md text-center block">
            📁 Cargar Excel de Cuentas (.xlsx / .csv)
            <input type="file" id="fileCuentasInput" accept=".xlsx, .xls, .csv" class="hidden" />
          </label>

          <div id="contenedorMapeoCuentas" class="hidden space-y-2 pt-2 border-t border-slate-100">
            <p class="text-[11px] font-black text-slate-600 uppercase">Columnas detectadas en Cuentas:</p>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div>
                <label class="font-bold text-slate-600 block mb-0.5 text-[10px]">👤 Cliente</label>
                <select id="colClienteSel" class="w-full bg-amber-50/70 border border-[#C6D82E] p-1.5 rounded-lg font-bold text-[#0A1931] text-xs outline-none"></select>
              </div>
              <div>
                <label class="font-bold text-slate-600 block mb-0.5 text-[10px]">💰 Monto Mínimo</label>
                <select id="colMontoSel" class="w-full bg-slate-50 border border-slate-200 p-1.5 rounded-lg font-semibold text-xs outline-none"></select>
              </div>
              <div>
                <label class="font-bold text-slate-600 block mb-0.5 text-[10px]">📱 Tel. Cliente</label>
                <select id="colCelularSel" class="w-full bg-slate-50 border border-slate-200 p-1.5 rounded-lg font-semibold text-xs outline-none"></select>
              </div>
              <div>
                <label class="font-bold text-slate-600 block mb-0.5 text-[10px]">🏦 CLABE / STP</label>
                <select id="colClabeSel" class="w-full bg-slate-50 border border-slate-200 p-1.5 rounded-lg font-semibold text-xs outline-none"></select>
              </div>
              <div class="col-span-2 sm:col-span-1">
                <label class="font-bold text-slate-600 block mb-0.5 text-[10px]">👔 Gestor Asignado (Opcional):</label>
                <select id="colGestorSel" class="w-full bg-blue-50/60 border border-blue-200 p-1.5 rounded-lg font-bold text-[#4348EB] text-xs outline-none">
                  <option value="">-- Usar Gestor por Defecto --</option>
                </select>
              </div>
              <div class="col-span-2 sm:col-span-1">
                <label class="font-bold text-slate-600 block mb-0.5 text-[10px]">📍 Región / Ciudad (Opcional):</label>
                <select id="colCuentaRegionSel" class="w-full bg-slate-50 border border-slate-200 p-1.5 rounded-lg font-semibold text-xs outline-none">
                  <option value="">-- Usar Default --</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- LISTA Y BÚSQUEDA DE CUENTAS -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex justify-between items-center">
            <h3 id="contadorLista" class="text-xs font-black uppercase tracking-wider text-[#0A1931]">Cuentas (0)</h3>
            <select id="selectOrden" class="text-xs bg-slate-100 border border-slate-200 p-1.5 rounded-lg font-bold text-slate-700 outline-none">
              <option value="monto_desc">Monto: $$$ &rarr; $</option>
              <option value="monto_asc">Monto: $ &rarr; $$$</option>
              <option value="nombre_asc">Nombre (A - Z)</option>
            </select>
          </div>

          <input type="text" id="buscarCuentaInput" placeholder="🔍 Buscar por cliente, gestor o celular..." class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold text-[#0A1931] outline-none focus:ring-2 focus:ring-[#4348EB]" />

          <div id="listaCuentasContainer" class="max-h-[220px] overflow-y-auto space-y-2 pr-1 text-xs">
            <div class="text-center py-8 text-slate-400">Carga el Excel de cuentas para visualizarlas aquí.</div>
          </div>
        </div>

        <!-- PASO 3: BOTONES DE EXPORTACIÓN -->
        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 relative overflow-hidden">
          <div id="overlayProgreso" class="hidden absolute

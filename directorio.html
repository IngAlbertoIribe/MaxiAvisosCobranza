<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maxikash - Directorio Interno</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#E8EEF7] min-h-screen text-slate-800">

  <div class="w-full max-w-4xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <header class="bg-[#4348EB] rounded-2xl p-6 text-white mb-6 flex flex-col md:flex-row items-center justify-between shadow-xl gap-4">
      <div class="flex items-center gap-4">
        <img src="logo.png" alt="Logo" class="h-10 w-auto object-contain" onerror="this.style.display='none'" />
        <div>
          <h1 class="text-xl font-black tracking-tight">DIRECTORIO DE COBRANZA</h1>
          <p class="text-slate-300 text-xs mt-0.5">Llamadas y WhatsApp Directo a Gestores</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-xs font-bold transition-all border border-white/20">
          ⬅ Generador
        </a>
        <a href="gestores.html" class="bg-[#C6D82E] hover:bg-[#B5C62A] text-[#0A1931] px-3 py-2 rounded-xl text-xs font-bold transition-all shadow-md">
          👔 Gestores
        </a>
      </div>
    </header>

    <!-- Buscador -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex items-center gap-3">
      <span class="text-xl">🔍</span>
      <input type="text" id="inputBuscar" placeholder="Buscar por nombre, teléfono o área..." class="w-full bg-transparent text-sm font-bold text-[#0A1931] outline-none" />
      <span id="badgeTotal" class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold">0 gestores</span>
    </div>

    <!-- Lista Directorio -->
    <div id="gridDirectorio" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="col-span-full text-center py-12 text-slate-400 text-xs">Cargando directorio...</div>
    </div>
  </div>

  <script>
    const GESTORES_DEFAULT = [
      { id: "1", nombre: "Lic. Fernando Arenas", telefono: "6861183207", puesto: "Coordinación Mexicali" },
      { id: "2", nombre: "Lic. María Guadalupe", telefono: "6861234567", puesto: "Gestor Domiciliario" },
      { id: "3", nombre: "Lic. Carlos Ruiz", telefono: "6869876543", puesto: "Gestor Telefónico" },
      { id: "4", nombre: "Lic. Ana Victoria", telefono: "6865551122", puesto: "Atención Especial" }
    ];

    let gestores = [];
    const gridDirectorio = document.getElementById('gridDirectorio');
    const inputBuscar = document.getElementById('inputBuscar');
    const badgeTotal = document.getElementById('badgeTotal');

    fetch('gestores.json?nocache=' + Date.now())
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(data => {
        gestores = Array.isArray(data) && data.length > 0 ? data : GESTORES_DEFAULT;
        renderizar();
      })
      .catch(() => {
        gestores = GESTORES_DEFAULT;
        renderizar();
      });

    function renderizar() {
      const q = (inputBuscar.value || "").toLowerCase();
      const filtrados = gestores.filter(g => 
        (g.nombre || "").toLowerCase().includes(q) || 
        (g.telefono || "").includes(q) ||
        (g.puesto || "").toLowerCase().includes(q)
      );

      badgeTotal.textContent = `${filtrados.length} ${filtrados.length === 1 ? 'gestor' : 'gestores'}`;
      gridDirectorio.innerHTML = "";

      if (filtrados.length === 0) {
        gridDirectorio.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 text-xs">No se encontraron gestores con ese criterio.</div>';
        return;
      }

      filtrados.forEach(g => {
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-all flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-3 mb-3">
              <div class="w-10 h-10 rounded-full bg-[#4348EB]/10 text-[#4348EB] font-black flex items-center justify-center text-sm">
                ${(g.nombre || "G").charAt(0)}
              </div>
              <div>
                <h3 class="font-black text-sm text-[#0A1931] leading-tight">${g.nombre}</h3>
                <p class="text-[11px] text-slate-500 font-medium">${g.puesto || 'Gestor Autorizado'}</p>
              </div>
            </div>
            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 mb-4">
              <span class="text-[10px] uppercase font-bold text-slate-400 block">Número Móvil</span>
              <span class="mono font-bold text-sm text-[#0A1931]">${g.telefono}</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
            <a href="tel:${g.telefono}" class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold py-2 rounded-xl flex items-center justify-center gap-1.5 transition-all">
              <span>📞</span> Llamar
            </a>
            <a href="https://wa.me/52${g.telefono}" target="_blank" class="bg-[#22C55E] hover:bg-green-600 text-white text-xs font-bold py-2 rounded-xl flex items-center justify-center gap-1.5 transition-all shadow-sm">
              <span>💬</span> WhatsApp
            </a>
          </div>
        `;
        gridDirectorio.appendChild(card);
      });
    }

    inputBuscar.addEventListener('input', renderizar);
  </script>
</body>
</html>

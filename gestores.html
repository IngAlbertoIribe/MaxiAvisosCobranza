<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maxikash - Administrador de Gestores</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#E8EEF7] min-h-screen text-slate-800">

  <div class="w-full max-w-4xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <header class="bg-[#4348EB] rounded-2xl p-6 text-white mb-6 flex flex-col md:flex-row items-center justify-between shadow-xl gap-4">
      <div class="flex items-center gap-4">
        <img src="logo.png" alt="Logo" class="h-10 w-auto object-contain" onerror="this.style.display='none'" />
        <div>
          <h1 class="text-xl font-black tracking-tight">ADMINISTRADOR DE GESTORES</h1>
          <p class="text-slate-300 text-xs mt-0.5">Gestión de Personal y Descarga de gestores.json</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl text-xs font-bold transition-all border border-white/20">
          ⬅ Generador
        </a>
        <a href="directorio.html" class="bg-[#C6D82E] hover:bg-[#B5C62A] text-[#0A1931] px-3 py-2 rounded-xl text-xs font-bold transition-all shadow-md">
          📖 Directorio
        </a>
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
      <!-- Formulario para agregar / editar -->
      <div class="md:col-span-5 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
        <h2 id="formTitulo" class="text-sm font-black text-[#0A1931] uppercase tracking-wider flex items-center gap-2">
          <span>➕</span> Agregar Nuevo Gestor
        </h2>
        <form id="gestorForm" class="space-y-3">
          <input type="hidden" id="gestorId" />
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Nombre Completo:</label>
            <input type="text" id="gestorNombre" required placeholder="Ej. Lic. Fernando Arenas" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold focus:ring-2 focus:ring-[#4348EB] outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Teléfono (WhatsApp 10 dígitos):</label>
            <input type="tel" id="gestorTelefono" required maxlength="10" placeholder="Ej. 6861183207" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold focus:ring-2 focus:ring-[#4348EB] outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Puesto / Zona (Opcional):</label>
            <input type="text" id="gestorPuesto" placeholder="Ej. Cobranza Domiciliaria / Mexicali" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-medium focus:ring-2 focus:ring-[#4348EB] outline-none" />
          </div>
          <div class="pt-2 flex gap-2">
            <button type="submit" id="btnGuardar" class="flex-1 bg-[#4348EB] hover:bg-[#3439CA] text-white font-bold py-2.5 rounded-xl text-xs shadow-md transition-all">
              Guardar Gestor
            </button>
            <button type="button" id="btnCancelarEdicion" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-2.5 rounded-xl text-xs transition-all">
              Cancelar
            </button>
          </div>
        </form>

        <div class="pt-4 border-t border-slate-100">
          <h3 class="text-xs font-black text-[#0A1931] uppercase mb-2">Exportar a GitHub</h3>
          <p class="text-[11px] text-slate-500 mb-3">Descarga el archivo actualizado y súbelo a tu repositorio en GitHub para sincronizar a todos los gestores.</p>
          <button id="btnDescargarJSON" class="w-full bg-[#C6D82E] hover:bg-[#B5C62A] text-[#0A1931] font-black py-2.5 rounded-xl text-xs shadow-sm transition-all flex items-center justify-center gap-1.5">
            <span>💾</span> Descargar gestores.json
          </button>
        </div>
      </div>

      <!-- Lista de Gestores Registrados -->
      <div class="md:col-span-7 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
        <div class="flex justify-between items-center mb-3">
          <h3 id="contadorGestores" class="text-xs font-black uppercase tracking-wider text-[#0A1931]">Gestores Activos (0)</h3>
          <input type="text" id="buscarGestor" placeholder="🔍 Filtrar..." class="bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium outline-none focus:ring-2 focus:ring-[#4348EB] w-36" />
        </div>

        <div id="listaContenedor" class="space-y-2 overflow-y-auto max-h-[500px] pr-1 flex-1">
          <div class="text-center py-10 text-slate-400 text-xs">Cargando gestores...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GESTORES_DEFAULT = [
      { id: "1", nombre: "Lic. Fernando Arenas", telefono: "6861183207", puesto: "Coordinación Mexicali" },
      { id: "2", nombre: "Lic. María Guadalupe", telefono: "6861234567", puesto: "Gestor Domiciliario" },
      { id: "3", nombre: "Lic. Carlos Ruiz", telefono: "6869876543", puesto: "Gestor Telefónico" },
      { id: "4", nombre: "Lic. Ana Victoria", telefono: "6865551122", puesto: "Atención Especial" }
    ];

    let gestores = [];

    const gestorForm = document.getElementById('gestorForm');
    const formTitulo = document.getElementById('formTitulo');
    const gestorId = document.getElementById('gestorId');
    const gestorNombre = document.getElementById('gestorNombre');
    const gestorTelefono = document.getElementById('gestorTelefono');
    const gestorPuesto = document.getElementById('gestorPuesto');
    const btnGuardar = document.getElementById('btnGuardar');
    const btnCancelarEdicion = document.getElementById('btnCancelarEdicion');
    const btnDescargarJSON = document.getElementById('btnDescargarJSON');
    const listaContenedor = document.getElementById('listaContenedor');
    const contadorGestores = document.getElementById('contadorGestores');
    const buscarGestor = document.getElementById('buscarGestor');

    // Cargar inicial
    fetch('gestores.json?nocache=' + Date.now())
      .then(res => res.ok ? res.json() : Promise.reject())
      .then(data => {
        gestores = Array.isArray(data) && data.length > 0 ? data : GESTORES_DEFAULT;
        renderizar();
      })
      .catch(() => {
        gestores = GESTORES_DEFAULT;
        renderizar();
      });

    function renderizar() {
      const q = (buscarGestor.value || "").toLowerCase();
      const filtrados = gestores.filter(g => 
        (g.nombre || "").toLowerCase().includes(q) || 
        (g.telefono || "").includes(q) ||
        (g.puesto || "").toLowerCase().includes(q)
      );

      contadorGestores.textContent = `Gestores Activos (${filtrados.length})`;
      listaContenedor.innerHTML = "";

      if (filtrados.length === 0) {
        listaContenedor.innerHTML = '<div class="text-center py-8 text-slate-400 text-xs">No hay gestores que coincidan.</div>';
        return;
      }

      filtrados.forEach(g => {
        const item = document.createElement('div');
        item.className = "p-3.5 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-3 hover:bg-white hover:border-blue-200 transition-all";
        item.innerHTML = `
          <div class="truncate">
            <h4 class="font-bold text-sm text-[#0A1931]">${g.nombre}</h4>
            <div class="flex items-center gap-2 text-xs text-slate-500 mt-0.5">
              <span class="mono font-bold text-[#4348EB]">📱 ${g.telefono}</span>
              ${g.puesto ? `<span>• ${g.puesto}</span>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="editarGestor('${g.id}')" class="p-2 hover:bg-blue-50 text-blue-600 rounded-lg text-xs font-bold transition-all" title="Editar">✏️</button>
            <button onclick="eliminarGestor('${g.id}')" class="p-2 hover:bg-red-50 text-red-600 rounded-lg text-xs font-bold transition-all" title="Eliminar">🗑️</button>
          </div>
        `;
        listaContenedor.appendChild(item);
      });
    }

    buscarGestor.addEventListener('input', renderizar);

    gestorForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = gestorId.value;
      const nombre = gestorNombre.value.trim();
      const telefono = gestorTelefono.value.replace(/\D/g, "");
      const puesto = gestorPuesto.value.trim();

      if (id) {
        // Editar
        gestores = gestores.map(g => g.id === id ? { ...g, nombre, telefono, puesto } : g);
      } else {
        // Nuevo
        gestores.push({
          id: String(Date.now()),
          nombre,
          telefono,
          puesto
        });
      }

      resetearFormulario();
      renderizar();
    });

    window.editarGestor = (id) => {
      const g = gestores.find(item => item.id === id);
      if (!g) return;
      gestorId.value = g.id;
      gestorNombre.value = g.nombre;
      gestorTelefono.value = g.telefono;
      gestorPuesto.value = g.puesto || "";
      formTitulo.innerHTML = '<span>✏️</span> Editar Gestor';
      btnGuardar.textContent = "Actualizar Gestor";
      btnCancelarEdicion.classList.remove('hidden');
    };

    window.eliminarGestor = (id) => {
      if (confirm("¿Estás seguro de eliminar a este gestor?")) {
        gestores = gestores.filter(g => g.id !== id);
        resetearFormulario();
        renderizar();
      }
    };

    btnCancelarEdicion.addEventListener('click', resetearFormulario);

    function resetearFormulario() {
      gestorId.value = "";
      gestorNombre.value = "";
      gestorTelefono.value = "";
      gestorPuesto.value = "";
      formTitulo.innerHTML = '<span>➕</span> Agregar Nuevo Gestor';
      btnGuardar.textContent = "Guardar Gestor";
      btnCancelarEdicion.classList.add('hidden');
    }

    // Descargar gestores.json
    btnDescargarJSON.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gestores, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "gestores.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });
  </script>
</body>
</html>
